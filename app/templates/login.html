<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Access Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-amber-500 to-amber-600"></div>
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/20 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight">Practice Management Login</h2>
            <p class="text-sm text-slate-400 mt-1">Provide credentials to enter secure system spaces</p>
        </div>

        <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-rose-950/40 border border-rose-800/40 text-rose-300 text-sm flex items-start space-x-2 animate-shake">
            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
            <span id="error-message">Access validation matrix declined your entry status tokens.</span>
        </div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" required autocomplete="username" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-amber-500 text-sm placeholder-slate-600 transition" placeholder="e.g., administrator">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Security Secret Passcode</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required autocomplete="current-password" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-amber-500 text-sm placeholder-slate-600 transition" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-amber-500/10 cursor-pointer flex items-center justify-center space-x-2 mt-2">
                <span id="btn-text">Verify Access Security</span>
                <span id="btn-icon"><i class="fa-solid fa-arrow-right text-xs"></i></span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('auth-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errAlert = document.getElementById('error-alert');
            const errMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            
            // Re-initialize transient status monitors
            errAlert.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.innerText = "Parsing Validation Assertions...";
            btnIcon.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-xs"></i>`;

            const payload = new URLSearchParams();
            payload.append('username', document.getElementById('username').value);
            payload.append('password', document.getElementById('password').value);

            try {
                // FIX: Update destination URI to route through your specific /api gateway layout
                const response = await fetch('/auth/login', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: payload
});

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Authentication verification validation mismatch.");
                }

                // FIX: Save raw token string natively inside cookies for seamless extractor parsing pass compatibility
                document.cookie = `access_token=${data.access_token}; path=/; max-age=${60 * 60 * 12}; SameSite=Strict`;
                
                // Route validated user onward into workspace terminal interface matrix
                window.location.href = "/";

            } catch (err) {
                // Safely catch anomalies and update UI structures without stripping structural nodes
                errMsg.innerText = err.message;
                errAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.innerText = "Verify Access Security";
                btnIcon.innerHTML = `<i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        });
    </script>
</body>
</html>
